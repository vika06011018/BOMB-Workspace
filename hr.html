<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>HR 人力資源｜BOMB Portal</title>
<style>
:root{color-scheme:dark;--bg:#0b0c0d;--panel:#141516;--ink:#f1f2f4;--muted:#bdc0c5;--gold:#edba60;--line:#53442b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 Arial,'Microsoft JhengHei',sans-serif}header{border-bottom:1px solid var(--line);padding:22px max(24px,calc((100vw - 1050px)/2));display:flex;justify-content:space-between;gap:20px}a{color:var(--gold)}main{max-width:760px;margin:60px auto;padding:0 24px}h1{font-size:34px;line-height:1.4;margin:8px 0 12px}.eyebrow{color:var(--gold);font-weight:bold}p{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px;margin-top:28px}label{display:block;margin:18px 0 8px}input,button{font:inherit;border-radius:8px;padding:13px 15px}input{width:100%;background:var(--bg);color:var(--ink);border:1px solid #626262}button{cursor:pointer;border:1px solid var(--gold);background:var(--gold);color:#18130b;font-weight:bold;width:100%;margin-top:24px}button:disabled{opacity:.6;cursor:wait}button.secondary{background:transparent;color:var(--gold);margin-top:12px}small{color:var(--muted)}#status{min-height:29px;white-space:pre-line;margin-top:18px}#status[data-error=true]{color:#ffb7b7}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #ffe0a2;outline-offset:3px}[hidden]{display:none!important}.identity{color:var(--gold)}@media(max-width:600px){main{margin-top:30px}.panel{padding:22px}h1{font-size:28px}header{font-size:15px}}@media(prefers-color-scheme:light){:root[data-theme=light]{color-scheme:light;--bg:#f7f6f2;--panel:#fff;--ink:#252525;--muted:#5d5d5d;--gold:#946214;--line:#d1c3a9}}
</style></head><body><header><strong>BOMB Portal</strong><a href="./index.html">返回工作大廳</a></header><main><div class="eyebrow">HR 人力資源</div><h1>連接 HR 管理後台</h1><p>使用既有 HR 管理帳號確認身分。驗證成功後，在登入有效期間可直接開啟後台。</p><div class="panel"><div class="identity" id="identity"></div><form id="form"><label for="company">HR 公司代碼</label><input id="company" required autocomplete="organization" maxlength="80"><label for="employee">員工編號</label><input id="employee" readonly required autocomplete="username"><label for="password">HR 管理後台密碼</label><input id="password" type="password" required autocomplete="current-password"><small>請使用原本的 HR 管理密碼；公司代碼請填 HR 登入時使用的代碼。</small><button id="connect" type="submit">驗證 HR 管理身分</button></form><section id="connected" hidden><p id="account"></p><button id="open" type="button">開啟 HR 管理後台</button><button id="disconnect" class="secondary" type="button">登出 HR 連線</button></section><div id="status" role="status" aria-live="polite"></div></div></main><script src="./assets/workspace-auth.js"></script><script src="./assets/workspace-hr.js"></script></body></html>
