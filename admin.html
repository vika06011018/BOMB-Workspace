</style></head><body><div id="app" hidden><header class="header"><div class="brand"><svg viewBox="0 0 64 70" aria-hidden="true"><path d="M32 1 60 16 32 31 4 16ZM2 23l25 14v32L2 55Zm35 14 25-14v32L37 69Z"/></svg><div>BOMB<small>WORKSPACE</small></div><span class="header-title">行政、採購與會計管理</span></div><div class="header-actions"><button type="button" class="plain menu" id="menu" aria-label="開啟功能選單" aria-expanded="false">☰</button><div class="identity"><span class="avatar" id="avatar"></span><span id="identityText"></span></div><button type="button" class="plain theme" id="theme"></button><a class="plain" href="./index.html">工作大廳</a></div></header><div class="shell"><nav class="sidebar" id="nav" aria-label="功能選單"></nav><main class="main"><div class="crumb" id="crumb">工作大廳 ／ 行政、採購與會計管理</div><div class="heading"><div><h1 id="title">行政、採購與會計工作台</h1><p id="subtitle">集中處理辦公室設備保養、採購及請款作業。</p></div><span class="badge">介面預覽</span></div><section id="overview"><div class="areas" id="areas"></div><div class="lower"><section class="panel"><div class="panel-title"><h2>待處理工作</h2><small>依帳號權限顯示</small></div><div class="empty"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="5" width="19" height="24" rx="2"/><path d="M12 3h9v5h-9Zm0 12h9m-9 6h9"/></svg><h3>待處理清單尚未啟用</h3><p>後續集中顯示待保養、待審核及待請款事項。</p></div></section><section class="panel"><div class="panel-title"><h2>常用入口</h2></div><div class="quick"><button class="btn secondary" data-route="equipment">辦公室設備 <span>→</span></button><button class="btn secondary" data-route="maintenance">設備保養 <span>→</span></button><button class="btn secondary" data-route="claims">請款管理 <span>→</span></button></div></section></div><p class="scope">辦公室既有冷氣、空氣清淨機、UPS等設備於行政區管理，設備建檔後接續保養紀錄，不需補做倉儲收貨與上架。</p></section><section class="module-view" id="module" hidden><div class="panel"><h2 id="moduleTitle"></h2><p class="module-copy" id="moduleCopy"></p><div class="steps" id="steps"></div><div class="empty"><h3>功能規劃中</h3><p>本次先確認入口與版面，尚未開放建單、簽核或付款。</p></div></div><button class="btn secondary back-home" data-route="overview">返回工作台 <span>←</span></button></section><footer class="footer"><span id="company"></span><span>介面預覽 · 尚未串接實際案件</span></footer></main></div></div><section id="authError" class="auth-error" hidden><h1>請先登入工作大廳</h1><p>此入口依行政系統權限開放。</p><a href="./index.html">返回工作大廳 →</a></section><script src="./assets/workspace-auth.js"></script><script>
(function(){'use strict';const p=Workspace.current(),$=id=>document.getElementById(id);if(!p||!p.systems.includes('ADMIN')){$('authError').hidden=false;return;}const icons={home:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',equipment:'<rect x="3" y="3" width="18" height="13" rx="2"/><path d="M8 21h8m-4-5v5"/>',maintenance:'<path d="M20 4a6 6 0 0 1-8 8L4 21l-2-3 9-9a6 6 0 0 1 8-7l-4 4 3 3Z"/>',vendor:'<path d="M3 21V8l9-5 9 5v13H3Zm5 0v-7h8v7M8 9h0m8 0h0"/>',buy:'<path d="M2 3h4l3 13h10l3-9H7"/><circle cx="10" cy="21" r="1"/><circle cx="19" cy="21" r="1"/>',file:'<path d="M5 2h10l4 5v15H5ZM14 2v6h5M9 12h6m-6 5h6"/>',money:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h2m4 0h2m-8 5h2m4 0h2"/>',return:'<path d="M4 7h15m-4-4 4 4-4 4M20 17H5m4-4-4 4 4 4"/>'};const icon=k=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[k]+'</svg>';
const groups=[{name:'行政',icon:'equipment',intro:'辦公室設備一次建檔，持續追蹤保養與廠商服務。',routes:['equipment','maintenance','vendors']},{name:'採購',icon:'buy',intro:'處理請購、廠商報價與訂購，接續退換貨協調。',routes:['purchasing','quotes','returns']},{name:'會計',icon:'money',intro:'核對請款與憑證，追蹤核准後的付款及帳務紀錄。',routes:['claims','payments']}];const routes={equipment:{name:'辦公室設備',icon:'equipment',copy:'冷氣、空氣清淨機、UPS等既有辦公室設備於此建檔，記錄設備名稱、所在位置、廠商及保養週期。',steps:['設備建檔','保養週期','設備履歷']},maintenance:{name:'設備保養',icon:'maintenance',copy:'安排廠商到場服務，記錄保養內容與日期，規劃由廠商及公司驗收人簽認後，各自留存一份單據。',steps:['安排保養','填寫紀錄','雙方簽認','有費用時請款']},vendors:{name:'廠商資料',icon:'vendor',copy:'維護廠商聯絡方式，供行政保養、採購與會計共同引用。',steps:['基本資料','聯絡方式','案件關聯']},purchasing:{name:'請購與採購',icon:'buy',copy:'整理需求、詢價及訂購資訊；審核方式依公司確認的規則設定。',steps:['提出需求','核准／決策','訂購','到貨追蹤']},quotes:{name:'詢價與比價',icon:'file',copy:'整理不同廠商的報價與附件，保留選定廠商的依據；送審層級待公司確認。',steps:['蒐集報價','比較條件','確認方案']},returns:{name:'退換貨協調',icon:'return',copy:'接續倉儲驗退或異常案件，記錄與廠商協調的結果，涉及退款時連結會計處理。',steps:['接收案件','廠商協調','退換貨結果']},claims:{name:'請款管理',icon:'file',copy:'彙整採購或保養案件的金額、憑證與驗收資料，再依設定的簽核規則送審。',steps:['關聯案件','核對憑證','送審']},payments:{name:'付款與帳務',icon:'money',copy:'依核准請款記錄付款及退款結果，保留日期、金額與相關憑證。',steps:['核准請款','付款登記','帳務紀錄']}};
const home=document.createElement('button');home.className='nav-button';home.type='button';home.dataset.route='overview';home.innerHTML=icon('home')+'工作首頁';$('nav').append(home);for(const group of groups){const label=document.createElement('div');label.className='nav-label';label.textContent=group.name;$('nav').append(label);for(const id of group.routes){const b=document.createElement('button');b.className='nav-button';b.type='button';b.dataset.route=id;b.innerHTML=icon(routes[id].icon);b.append(document.createTextNode(routes[id].name));$('nav').append(b);}const area=document.createElement('article');area.className='area';area.innerHTML='<div class="area-top"><span class="area-icon">'+icon(group.icon)+'</span><h2>'+group.name+'管理</h2></div><p class="description"></p><ul></ul>';area.querySelector('.description').textContent=group.intro;for(const id of group.routes){const li=document.createElement('li');li.textContent=routes[id].name;area.querySelector('ul').append(li);}const b=document.createElement('button');b.className='btn';b.type='button';b.dataset.route=group.routes[0];b.textContent='進入'+group.name+'作業';const arrow=document.createElement('span');arrow.textContent='→';b.append(arrow);area.append(b);$('areas').append(area);}const back=document.createElement('a');back.href='./index.html#lobby';back.className='return';back.innerHTML='<svg class="lobby-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="2" y="2" width="4" height="4" rx="1"/><rect x="10" y="2" width="4" height="4" rx="1"/><rect x="18" y="2" width="4" height="4" rx="1"/><rect x="2" y="10" width="4" height="4" rx="1"/><rect x="10" y="10" width="4" height="4" rx="1"/><rect x="18" y="10" width="4" height="4" rx="1"/><rect x="2" y="18" width="4" height="4" rx="1"/><rect x="10" y="18" width="4" height="4" rx="1"/><rect x="18" y="18" width="4" height="4" rx="1"/></svg><span>返回工作大廳</span>';$('nav').append(back);
function go(id){const route=routes[id],overview=!route;document.querySelectorAll('#nav [data-route]').forEach(b=>{b.classList.toggle('active',b.dataset.route===(overview?'overview':id));b.setAttribute('aria-current',b.classList.contains('active')?'page':'false')});$('overview').hidden=!overview;$('module').hidden=overview;$('title').textContent=overview?'行政、採購與會計工作台':route.name;$('subtitle').textContent=overview?'集中處理辦公室設備保養、採購及請款作業。':'行政、採購與會計管理';if(route){$('moduleTitle').textContent=route.name;$('moduleCopy').textContent=route.copy;$('steps').replaceChildren(...route.steps.map(s=>{const el=document.createElement('span');el.textContent=s;return el;}));}$('nav').classList.remove('open');$('menu').setAttribute('aria-expanded','false');history.replaceState(null,'','#'+(overview?'overview':id));window.scrollTo(0,0);}document.addEventListener('click',e=>{const b=e.target.closest('[data-route]');if(b)go(b.dataset.route)});$('menu').onclick=()=>{$('menu').setAttribute('aria-expanded',String($('nav').classList.toggle('open')))};document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('nav').classList.remove('open');$('menu').setAttribute('aria-expanded','false')}});$('identityText').textContent=p.name+' · '+Workspace.roles[Workspace.role(p)];$('avatar').textContent=Array.from(p.name).slice(0,2).join('');$('company').textContent='企業 '+p.company+'　帳號 '+p.account;const key='bomb-workspace-theme-v1';function theme(v,save){document.documentElement.dataset.theme=v;$('theme').textContent=v==='dark'?'☀ 淺色模式':'☾ 深色模式';$('theme').setAttribute('aria-label',v==='dark'?'切換為淺色模式':'切換為深色模式');if(save)try{localStorage.setItem(key,v)}catch{}}$('theme').onclick=()=>theme(document.documentElement.dataset.theme==='light'?'dark':'light',true);theme(document.documentElement.dataset.theme==='light'?'light':'dark',false);window.addEventListener('pageshow',()=>{if(!Workspace.current()?.systems.includes('ADMIN'))location.replace('./index.html')});window.addEventListener('storage',e=>{if(e.key===key){theme(e.newValue==='light'?'light':'dark',false);return;}if(!Workspace.current()?.systems.includes('ADMIN'))location.replace('./index.html')});$('app').hidden=false;go(location.hash.slice(1));})();
</script></body></html>
